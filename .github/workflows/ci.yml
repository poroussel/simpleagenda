name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gnustep-make \
            libgnustep-base-dev \
            gnustep-base-runtime \
            libgnustep-gui-dev \
            gnustep-gui-runtime \
            gnustep-back-common \
            gobjc \
            libical-dev \
            uuid-dev \
            xvfb

      - name: Set up GNUstep environment
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          env | grep '^GNUSTEP_' >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Configure
        run: ./configure --disable-dbuskit

      - name: Build
        run: make

      - name: Test
        run: xvfb-run make check

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            tests.log
            tests.sum
