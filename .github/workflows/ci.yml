name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gnustep-make \
            libgnustep-base-dev \
            gnustep-base-runtime \
            libgnustep-gui-dev \
            gnustep-gui-runtime \
            gnustep-back-common \
            gobjc \
            libical-dev \
            uuid-dev \
            xvfb

      - name: Configure
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          ./configure --disable-dbuskit

      - name: Build
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          make

      - name: Test
        run: |
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          xvfb-run make check
